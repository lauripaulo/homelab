---
services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    hostname: syncthing
    environment:
      - PUID=1002 # admin
      - PGID=100  # users
      - TZ=Etc/UTC
    volumes:
      - ~/docker/apps/syncthing/cfg:/config
      - ~/docker/apps/syncthing/storage:/storage
      - /srv/samba:/samba
      - /srv:/srv
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    restart: unless-stopped
    networks:
      - homelab

networks:
  homelab:
    external: true